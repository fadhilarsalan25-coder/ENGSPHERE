<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">EngSphere</title>
  <desc id="desc">A luminous blue sphere with flowing white and cyan bands above the EngSphere wordmark.</desc>
  <defs>
    <radialGradient id="sphere" cx="34%" cy="24%" r="82%">
      <stop offset="0" stop-color="#e9fbff"/>
      <stop offset=".16" stop-color="#7eeaff"/>
      <stop offset=".42" stop-color="#08bbed"/>
      <stop offset=".72" stop-color="#0879ed"/>
      <stop offset="1" stop-color="#082bd0"/>
    </radialGradient>
    <linearGradient id="deepBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0635d5"/>
      <stop offset=".55" stop-color="#0716a9"/>
      <stop offset="1" stop-color="#020b67"/>
    </linearGradient>
    <linearGradient id="cyanBand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecffff"/>
      <stop offset=".18" stop-color="#9af7ff"/>
      <stop offset=".5" stop-color="#14d9ef"/>
      <stop offset="1" stop-color="#0086ef"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18d9f5"/>
      <stop offset=".5" stop-color="#078eee"/>
      <stop offset="1" stop-color="#102bd8"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="orbClip"><circle cx="512" cy="330" r="237"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="#000"/>

  <g filter="url(#glow)">
    <circle cx="512" cy="330" r="237" fill="url(#sphere)"/>
    <g clip-path="url(#orbClip)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M270 260 C370 155 485 198 578 242 C665 283 744 275 783 221" stroke="#bafaff" stroke-width="32" opacity=".92"/>
      <path d="M257 294 C372 221 458 255 554 302 C655 351 735 344 790 291" stroke="url(#cyanBand)" stroke-width="77"/>
      <path d="M254 293 C370 220 458 255 554 302 C655 351 735 344 790 291" stroke="#f3ffff" stroke-width="9" opacity=".92"/>
      <path d="M240 428 C335 331 427 354 522 404 C624 457 723 469 803 406" stroke="url(#cyanBand)" stroke-width="83"/>
      <path d="M240 428 C335 331 427 354 522 404 C624 457 723 469 803 406" stroke="#efffff" stroke-width="10" opacity=".95"/>
      <path d="M267 513 C353 449 432 468 506 511 C596 564 684 571 766 528" stroke="url(#deepBlue)" stroke-width="95"/>
      <path d="M266 514 C353 450 432 469 506 512 C596 565 684 572 766 529" stroke="#61ecff" stroke-width="8" opacity=".82"/>
      <path d="M304 610 C379 540 462 548 535 595 C613 646 688 648 751 608" stroke="url(#deepBlue)" stroke-width="82"/>
    </g>
    <ellipse cx="562" cy="243" rx="146" ry="89" fill="#eaffff" opacity=".25" transform="rotate(18 562 243)"/>
    <circle cx="512" cy="330" r="237" fill="none" stroke="#0bd8ff" stroke-width="8"/>
  </g>

  <text x="512" y="825" text-anchor="middle" fill="url(#wordmark)" font-family="Arial, Helvetica, sans-serif" font-size="108" font-weight="900" letter-spacing="-5">ENGSPHERE</text>
</svg>
